<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>05 覆蓋規劃五步驟</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="map.css">
<style></style>
<script src="../assets/scenes.js"></script>
<script src="map.js"></script>
<script src="engine.js"></script>
</head>
<body>
<div class="stage">
<p class="abs kicker" id="kick" style="left:96px; top:64px;">覆蓋規劃</p>
<h1 class="abs k title" id="t" style="left:96px; top:108px;">地圖進去，路線出來：五個步驟</h1>
<p class="abs lede" id="l1" style="left:96px; top:240px; width:1700px; font-size:34px;">建好的地圖先扣掉障礙物周圍的安全邊距，再依序經過五個步驟，變成一串給車子走的路點。</p>
<div class="abs c c0" style="left:96px; top:400px; width:310px;"><p class="num acid" style="font-size:110px; line-height:1;">①</p><p style="font-size:40px; font-weight:900; margin-top:24px;">PCA 主軸對齊</p><p class="mute" style="font-size:28px; line-height:1.5; margin-top:14px;">找散布最廣的方向當長軸，與它垂直的短軸當換行方向</p></div>
<p class="abs num ar ar0" style="left:396px; top:420px; font-size:60px; color:#2a4a50;">›</p>
<div class="abs c c1" style="left:456px; top:400px; width:310px;"><p class="num acid" style="font-size:110px; line-height:1;">②</p><p style="font-size:40px; font-weight:900; margin-top:24px;">切帶</p><p class="mute" style="font-size:28px; line-height:1.5; margin-top:14px;">沿短軸切成等寬的帶，每帶一條掃描線</p></div>
<p class="abs num ar ar1" style="left:756px; top:420px; font-size:60px; color:#2a4a50;">›</p>
<div class="abs c c2" style="left:816px; top:400px; width:310px;"><p class="num acid" style="font-size:110px; line-height:1;">③</p><p style="font-size:40px; font-weight:900; margin-top:24px;">cell 分解</p><p class="mute" style="font-size:28px; line-height:1.5; margin-top:14px;">把空間分成數個內部沒有障礙的 cell</p></div>
<p class="abs num ar ar2" style="left:1116px; top:420px; font-size:60px; color:#2a4a50;">›</p>
<div class="abs c c3" style="left:1176px; top:400px; width:310px;"><p class="num acid" style="font-size:110px; line-height:1;">④</p><p style="font-size:40px; font-weight:900; margin-top:24px;">cell 內牛耕</p><p class="mute" style="font-size:28px; line-height:1.5; margin-top:14px;">每個 cell 內來回掃描，只在換行處轉彎</p></div>
<p class="abs num ar ar3" style="left:1476px; top:420px; font-size:60px; color:#2a4a50;">›</p>
<div class="abs c c4" style="left:1536px; top:400px; width:310px;"><p class="num acid" style="font-size:110px; line-height:1;">⑤</p><p style="font-size:40px; font-weight:900; margin-top:24px;">cell 間銜接</p><p class="mute" style="font-size:28px; line-height:1.5; margin-top:14px;">由近到遠，最近的 cell 先做</p></div>
<div class="abs" id="ln" style="left:96px; top:800px; width:1728px; height:2px; background:#2a4a50;"></div>
<p class="abs mute" id="nt" style="left:96px; top:830px; font-size:28px;">①② 決定掃描方向與每條掃描線；③④⑤ 處理障礙物與走的順序</p>
</div>
<script>
const tr = [
  { sel: '#kick', at: 0.2, dur: 0.4, fx: 'up' }, { sel: '#t', at: 0.4, dur: 0.6, fx: 'up' },
  { sel: '#l1', at: 0.8, dur: 0.5, fx: 'up' },
];
for (let k = 0; k < 5; k++) {
  tr.push({ sel: '.c' + k, at: 1.6 + 1.2 * k, dur: 0.45, fx: 'up' });
  if (k > 0) tr.push({ sel: '.ar' + (k - 1), at: 1.5 + 1.2 * k, dur: 0.3, fx: 'fade' });
}
tr.push({ sel: '#ln', at: 7.6, dur: 0.6, fx: 'grow' }, { sel: '#nt', at: 7.8, dur: 0.5, fx: 'fade' });
Scene({ duration: 8.6, steps: [1.2, 2.2, 3.4, 4.6, 5.8, 7.0], tracks: tr });
</script>
</body>
</html>
