<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>04 自動建圖</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="map.css">
<style></style>
<script src="../assets/scenes.js"></script>
<script src="map.js"></script>
<script src="engine.js"></script>
</head>
<body>
<div class="stage">
<img id="flip" class="abs" src="../assets/mapflip/00.png" style="left:60px; top:110px; width:960px; height:909px; image-rendering:pixelated;">
<p class="abs kicker" id="kick" style="left:1120px; top:110px;">自動建圖</p>
<h1 class="abs k" id="t" style="left:1120px; top:156px; font-size:64px; line-height:1.25; width:760px;">自己找路，<br>建完整張地圖</h1>
<div class="abs ms" style="left:1120px; top:380px; width:760px;"><p class="num acid" style="font-size:32px;">① gmapping</p><p style="font-size:28px; line-height:1.4;">用光達一邊走、一邊畫地圖</p></div>
<div class="abs ms" style="left:1120px; top:495px; width:760px;"><p class="num acid" style="font-size:32px;">② explore_lite</p><p style="font-size:28px; line-height:1.4;">找出「已知空地」和「未知區域」的交界</p></div>
<div class="abs ms" style="left:1120px; top:610px; width:760px;"><p class="num acid" style="font-size:32px;">③ move_base</p><p style="font-size:28px; line-height:1.4;">開到交界去看更多；找不到交界就停下、存圖</p></div>
<div class="abs st" style="left:1120px; top:760px;"><p class="num acid" style="font-size:120px; line-height:1;"><span id="s1">6</span><span style="font-size:48px;"> / 6 次</span></p><p style="font-size:28px; font-weight:700;">實測都自己建出完整地圖</p></div>
</div>
<script>
const N = 47, imgs = [];
for (let i = 0; i < N; i++) { const im = new Image(); im.src = `../assets/mapflip/${String(i).padStart(2, '0')}.png`; imgs.push(im); }
Scene({ duration: 10, steps: [6.2], tracks: [
  { sel: '#flip', at: 0.0, dur: 0.6, fx: 'fade' },
  { sel: '#kick', at: 0.3, dur: 0.4, fx: 'up' }, { sel: '#t', at: 0.5, dur: 0.6, fx: 'up' },
  { sel: '.ms', at: 1.4, dur: 0.5, fx: 'up', stagger: 1.4 },
  { sel: '.st', at: 6.4, dur: 0.5, fx: 'up' },
  { sel: '#s1', at: 6.6, dur: 1.0, fx: 'count', from: 0, to: 6 },
], onTime: (t, u) => {
  const i = Math.round(u.clamp((t - 0.6) / 5.4) * (N - 1));
  const el = document.getElementById('flip');
  const src = imgs[i].src;
  if (el.src !== src) el.src = src;
}});
</script>
</body>
</html>
