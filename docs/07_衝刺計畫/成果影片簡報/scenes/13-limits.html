<div class="stage">
<p class="abs kicker" id="kick" style="left:96px; top:64px;">限制與未來規劃</p>
<h1 class="abs k title" id="t" style="left:96px; top:108px;">還沒做好的地方</h1>
<p class="abs num acid it0" style="left:96px; top:284px; font-size:72px; line-height:1;">01</p>
<p class="abs it0" style="left:240px; top:290px; width:1600px; font-size:44px; font-weight:900;">A* 在牆邊轉向，仍偶爾擦撞</p>
<p class="abs mute it0" style="left:240px; top:360px; width:1600px; font-size:28px;">3 次實驗推估共碰觸 3 次；主因是定位跳動與轉向空間不足</p>
<p class="abs it0" style="left:240px; top:408px; width:1600px; font-size:30px;"><span class="cyan">未來</span>　更準的定位（固定地圖＋AMCL）、轉向前的空間檢查再加強</p>
<p class="abs num acid it1" style="left:96px; top:524px; font-size:72px; line-height:1;">02</p>
<p class="abs it1" style="left:240px; top:530px; width:1600px; font-size:44px; font-weight:900;">只驗證單一長方形空間、方形障礙物</p>
<p class="abs mute it1" style="left:240px; top:600px; width:1600px; font-size:28px;">斜牆、L 形、多房間時 PCA 只能給一個方向</p>
<p class="abs it1" style="left:240px; top:648px; width:1600px; font-size:30px;"><span class="cyan">未來</span>　先把空間分區，再各自規劃</p>
<p class="abs num acid it2" style="left:96px; top:764px; font-size:72px; line-height:1;">03</p>
<p class="abs it2" style="left:240px; top:770px; width:1600px; font-size:44px; font-weight:900;">建完圖才規劃路徑</p>
<p class="abs mute it2" style="left:240px; top:840px; width:1600px; font-size:28px;">大空間要等整張地圖建好才開始掃</p>
<p class="abs it2" style="left:240px; top:888px; width:1600px; font-size:30px;"><span class="cyan">未來</span>　邊建圖邊覆蓋</p>
