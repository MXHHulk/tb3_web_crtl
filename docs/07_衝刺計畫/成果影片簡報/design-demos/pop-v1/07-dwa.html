<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>P7 問題三：DWA → 自寫循跡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 960pt; height: 540pt; position: relative; overflow: hidden; background: #FFFFFF;
         font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #111111; }
  .abs { position: absolute; }
  .bg  { left: 0; top: 0; width: 960pt; height: 540pt; }
  .k   { font-weight: 900; font-style: italic; }
  .num { font-family: "Bahnschrift", "Noto Sans TC", sans-serif; font-weight: 700; font-style: italic; }
</style>
</head>
<body>

  <img class="abs bg" src="../../assets/pop_data.png">
  <div class="abs" style="left: 40pt; top: 22pt; width: 720pt;">
    <h1 class="k" style="font-size: 30pt; color: #FFFFFF;">導航套件卡在牆邊 → 自己沿掃描線開</h1>
    <p style="font-size: 12pt; color: #FFE500; margin-top: 4pt;">實車・同一場地 1.06 × 1.47 m・兩種方式各 1 次（開發日誌 2026-11-11）；重複 3 次的平均待補</p>
  </div>

  <div class="abs" style="left: 62pt; top: 140pt; width: 300pt;">
    <p class="k" style="font-size: 20pt;">改善前・DWA</p>
    <p class="num" style="font-size: 92pt; line-height: 1.05;">71%</p>
    <p style="font-size: 16pt; font-weight: 700;">實際覆蓋率</p>
  </div>

  <div class="abs" style="left: 505pt; top: 150pt; width: 330pt;">
    <p class="k" style="font-size: 20pt; text-align: center;">改善後・自寫循跡</p>
    <p class="num" style="font-size: 110pt; line-height: 1.05; text-align: center; color: #FF1F8E;">97.7%</p>
    <p style="font-size: 16pt; font-weight: 700; text-align: center;">實際覆蓋率</p>
  </div>
  <div class="abs" style="left: 42.0pt; top: 418pt; width: 190pt;">
    <p style="font-size: 14pt; font-weight: 700;">執行時間</p>
    <p class="num" style="font-size: 28pt;">436 → 322 s</p>
  </div>
  <div class="abs" style="left: 269.5pt; top: 418pt; width: 190pt;">
    <p style="font-size: 14pt; font-weight: 700;">受困次數</p>
    <p class="num" style="font-size: 28pt;">3 → 1</p>
  </div>
  <div class="abs" style="left: 497.0pt; top: 418pt; width: 190pt;">
    <p style="font-size: 14pt; font-weight: 700;">DWA 規劃失敗</p>
    <p class="num" style="font-size: 28pt;">1127 → 209</p>
  </div>
  <div class="abs" style="left: 724.5pt; top: 418pt; width: 190pt;">
    <p style="font-size: 14pt; font-weight: 700;">實走／規劃距離</p>
    <p class="num" style="font-size: 28pt;">1.38 → 1.23</p>
  </div>
</body>
</html>
