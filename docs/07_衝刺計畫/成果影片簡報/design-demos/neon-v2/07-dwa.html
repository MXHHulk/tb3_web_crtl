<body>

  <img class="abs bg" src="../../assets/neon_data.png">
  <div class="abs" style="left: 60pt; top: 40pt; width: 80pt;">

  <div class="abs" style="left: 266pt; top: 416pt; width: 190pt;">

    <p class="num" style="font-size: 28pt;">3 → 1</p>
  </div>
