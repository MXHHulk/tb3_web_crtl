# gmapping 參數（本專案版）
# 以 turtlebot3_slam/config/gmapping_params.yaml 為底，只改下面標 ★ 的項目。
# 背景：2026-11-11 在 1.06 × 1.47 m 場地實測，官方參數建出的地圖空地中有零星假障礙、牆被畫成 2～3 格厚；
#       車子位置估計本身正常（scan matching 分數穩定），問題在「障礙判定太寬鬆」與「更新太少」。

map_update_interval: 2.0
maxUrange: 2.0          # ★ 3.0 → 2.0：用來畫地圖的光達距離上限。小場地用不到遠距離，遠處斜射的點最容易是雜訊
# maxRange 刻意不設（預設＝光達 range_max − 0.01 ≈ 3.49 m）。
# LDS-01 收不到反射時回報 0，slam_gmapping 會把它換成 range_max（3.5 m）；
# 預設 3.49 時這種讀值 > maxRange 會被忽略。若設成 3.5，它會被當成「此方向 maxUrange 內全是空地」，
# 憑空畫出一大圈空地、甚至擦掉牆（2026-11-11 實測踩過，一圈 360 筆有 153 筆是 0）。
sigma: 0.05
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0
lskip: 0
minimumScore: 50
srr: 0.1
srt: 0.2
str: 0.1
stt: 0.2
linearUpdate: 0.3       # ★ 1.0 → 0.3：每走 0.3 m 就把一圈光達畫進地圖（原本 1 m，小場地幾乎沒幾次更新，雜點很難被洗掉）。
                        #   曾用 0.2，但覆蓋時樹莓派負擔太重、導航控制迴圈趕不上，折衷為 0.3
angularUpdate: 0.15     # ★ 0.2 → 0.15：每轉約 9° 更新一次（曾用 0.1，理由同上）
temporalUpdate: 0.5
resampleThreshold: 0.5
particles: 100
xmin: -10.0
ymin: -10.0
xmax: 10.0
ymax: 10.0
delta: 0.05
occ_thresh: 0.5         # ★ 新增（gmapping 預設 0.25）：一格被打到的比例要過半才算障礙，偶發的雜訊、反光不會留下來
llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005
