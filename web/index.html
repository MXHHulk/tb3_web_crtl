<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurtleBot3 地圖即時監控</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 10px; }
        .map-wrapper {
            background-color: #7f8c8d;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
        }
        #map-img {
            max-width: 100%;
            display: block;
            border: 2px solid #ecf0f1;
        }
        .status {
            margin-top: 15px;
            font-size: 0.9em;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TurtleBot3 即時地圖監控</h1>
        <p>這份地圖是由 Flask 伺服器直接發佈的即時影像</p>
        
        <div class="map-wrapper">
            <img id="map-img" src="/map.png" alt="正在載入地圖...">
        </div>

        <div class="status">
            最後更新時間: <span id="time">--:--:--</span>
        </div>
    </div>

    <script>
        const img = document.getElementById('map-img');
        const timeSpan = document.getElementById('time');

        // 每隔 1 秒更新一次圖片
        setInterval(() => {
            const now = new Date();
            // 在網址後方加上 timestamp 參數，強制瀏覽器不快取
            img.src = "/map.png?t=" + now.getTime();
            timeSpan.innerText = now.toLocaleTimeString();
        }, 1000);

        img.onerror = function() {
            console.log("地圖尚未準備好，重試中...");
        };
    </script>
</body>
</html>
