<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurtleBot3 地圖監控</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 16px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 0.92em;
            font-weight: 600;
            color: #58a6ff;
            white-space: nowrap;
        }

        .layers { display: flex; gap: 6px; flex-wrap: wrap; }

        .layer-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 11px;
            border-radius: 20px;
            border: 1.5px solid currentColor;
            background: transparent;
            color: inherit;
            font-size: 0.76em;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.15s;
        }
        .layer-btn .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        .layer-btn.off { opacity: 0.35; }
        .layer-btn.off .dot { background: transparent; border: 1.5px solid currentColor; }

        .info {
            margin-left: auto;
            font-size: 0.70em;
            color: #8b949e;
            white-space: nowrap;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
            min-height: 0;   /* 讓 flex child 可縮小到 0 */
        }

        #map-canvas {
            display: block;
            image-rendering: pixelated;
            /* 寬高由 JS 動態設定，保持地圖長寬比填滿可用空間 */
        }

        #waiting {
            color: #8b949e;
            font-size: 1em;
        }
    </style>
</head>
<body>

<header>
    <h1>TurtleBot3 即時地圖</h1>
    <div class="layers" id="layers"></div>
    <div class="info" id="info">等待資料...</div>
</header>

<main>
    <canvas id="map-canvas" style="display:none"></canvas>
    <div id="waiting">等待地圖資料...</div>
</main>

<script>
// ── 圖層定義 ──────────────────────────────────────────────────────────────────
const LAYERS = [
    { id: 'orig',    label: '原始地圖', color: '#c9d1d9', type: 'map',   url: '/map.png',         on: true  },
    { id: 'eroded',  label: '侵蝕層',   color: '#58a6ff', type: 'map',   url: '/map_eroded.png',  on: true  },
    { id: 'dilated', label: '膨脹層',   color: '#ff7b72', type: 'map',   url: '/map_dilated.png', on: true  },
    { id: 'path',    label: '行走軌跡', color: '#e3b341', type: 'path',  on: true  },
    { id: 'robot',   label: '機器人',   color: '#3fb950', type: 'robot', on: true  },
];

// ── 建立圖層切換按鈕 ──────────────────────────────────────────────────────────
const layersEl = document.getElementById('layers');
LAYERS.forEach(layer => {
    const btn = document.createElement('button');
    btn.className = 'layer-btn' + (layer.on ? '' : ' off');
    btn.style.color = layer.color;
    btn.innerHTML = `<span class="dot"></span>${layer.label}`;
    btn.addEventListener('click', () => {
        layer.on = !layer.on;
        btn.classList.toggle('off', !layer.on);
        draw();
    });
    layersEl.appendChild(btn);
});

// ── Canvas & 狀態 ─────────────────────────────────────────────────────────────
const canvas     = document.getElementById('map-canvas');
const ctx        = canvas.getContext('2d');
const mainEl     = document.querySelector('main');
const imgCache   = {};   // layer.id → HTMLImageElement
let   robotState = { pos: null, path: [] };

/** 讓 canvas CSS 尺寸等比例填滿 main 容器（canvas 內部解析度不變）。 */
function fitCanvas() {
    const mapW = canvas.width, mapH = canvas.height;
    if (!mapW || !mapH) return;
    const availW = mainEl.clientWidth  - 20;
    const availH = mainEl.clientHeight - 20;
    const scale  = Math.min(availW / mapW, availH / mapH);
    canvas.style.width  = Math.round(mapW * scale) + 'px';
    canvas.style.height = Math.round(mapH * scale) + 'px';
}

window.addEventListener('resize', fitCanvas);

// ── 工具函式 ──────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
    return [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16),
    ];
}

/**
 * 把灰階地圖 PNG 轉成彩色圖層 canvas：
 *   障礙物（暗色）→ layer 指定色，空地（亮色）→ 透明，未知 → 半透明深灰
 */
function colorizeObstacles(img, hexColor) {
    const w = img.naturalWidth, h = img.naturalHeight;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);

    const id = cx.getImageData(0, 0, w, h);
    const d  = id.data;
    const [r, g, b] = hexToRgb(hexColor);

    for (let i = 0; i < d.length; i += 4) {
        const v = d[i];
        if (v < 80) {
            d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 220;
        } else if (v > 180) {
            d[i + 3] = 0;
        } else {
            d[i] = 55; d[i + 1] = 55; d[i + 2] = 75; d[i + 3] = 40;
        }
    }
    cx.putImageData(id, 0, 0);
    return c;
}

// ── 繪製 ─────────────────────────────────────────────────────────────────────
function draw() {
    const origImg = imgCache['orig'];
    if (!origImg) return;

    const W = origImg.naturalWidth, H = origImg.naturalHeight;
    if (canvas.width !== W || canvas.height !== H) {
        canvas.width = W; canvas.height = H;
        fitCanvas();
    }

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, W, H);

    // 地圖圖層
    for (const layer of LAYERS) {
        if (layer.type !== 'map' || !layer.on) continue;
        const img = imgCache[layer.id];
        if (!img) continue;

        if (layer.id === 'orig') {
            ctx.globalAlpha = 1;
            ctx.drawImage(img, 0, 0, W, H);
        } else {
            ctx.globalAlpha = 0.85;
            ctx.drawImage(colorizeObstacles(img, layer.color), 0, 0, W, H);
            ctx.globalAlpha = 1;
        }
    }

    // 行走軌跡
    const pathLayer = LAYERS.find(l => l.id === 'path');
    if (pathLayer.on && robotState.path.length > 1) {
        drawPath(robotState.path, pathLayer.color);
    }

    // 機器人
    const robotLayer = LAYERS.find(l => l.id === 'robot');
    if (robotLayer.on && robotState.pos) {
        const p = robotState.pos;
        drawRobot(p.x, p.y, robotLayer.color);
    }
}

function drawPath(path, color) {
    const FADE = 300;
    const n    = path.length;
    const fade = Math.max(0, n - FADE);

    // 舊軌跡：單筆劃，淡色
    if (fade > 1) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.2;
        ctx.lineWidth   = 1.5;
        ctx.lineJoin    = 'round';
        ctx.moveTo(path[0][0], path[0][1]);
        for (let i = 1; i <= fade; i++) ctx.lineTo(path[i][0], path[i][1]);
        ctx.stroke();
    }

    // 近期軌跡：逐段漸亮
    for (let i = Math.max(fade, 1); i < n; i++) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.2 + 0.8 * ((i - fade) / Math.max(FADE, 1));
        ctx.lineWidth   = 2;
        ctx.moveTo(path[i - 1][0], path[i - 1][1]);
        ctx.lineTo(path[i][0],     path[i][1]);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

function drawRobot(px, py, color) {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur  = 10;
    ctx.fillStyle   = color;
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.restore();
}

// ── 資料載入與定時刷新 ────────────────────────────────────────────────────────
function loadImg(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload  = () => resolve(img);
        img.onerror = reject;
        img.src = url + '?t=' + Date.now();
    });
}

async function refresh() {
    const mapLayers = LAYERS.filter(l => l.type === 'map');

    const [, stateResult] = await Promise.allSettled([
        Promise.all(mapLayers.map(async l => {
            try { imgCache[l.id] = await loadImg(l.url); } catch {}
        })),
        fetch('/robot_state').then(r => r.json()),
    ]);

    if (stateResult.status === 'fulfilled') robotState = stateResult.value;

    // 顯示 canvas，隱藏等待文字
    if (imgCache['orig']) {
        canvas.style.display = '';
        document.getElementById('waiting').style.display = 'none';
    }

    draw();

    const pos  = robotState.pos;
    const time = new Date().toLocaleTimeString('zh-TW');
    document.getElementById('info').textContent = pos
        ? `${time}　位置 (${pos.wx}, ${pos.wy}) m　方向 ${pos.yaw_deg}°　軌跡 ${robotState.path.length} 點`
        : `${time}　等待機器人資料`;
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
