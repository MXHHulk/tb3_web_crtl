<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurtleBot3 地圖監控</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 7px 14px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        header h1 { font-size: 0.9em; font-weight: 600; color: #58a6ff; white-space: nowrap; }

        /* ── Layer toggles ── */
        .layers { display: flex; gap: 5px; flex-wrap: wrap; }

        .layer-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 3px 10px;
            border-radius: 20px; border: 1.5px solid currentColor;
            background: transparent; color: inherit;
            font-size: 0.74em; cursor: pointer; user-select: none;
            transition: opacity 0.15s;
        }
        .layer-btn .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: currentColor; flex-shrink: 0;
        }
        .layer-btn.off { opacity: 0.35; }
        .layer-btn.off .dot { background: transparent; border: 1.5px solid currentColor; }

        /* ── Coverage controls ── */
        .cov-ctl { display: flex; align-items: center; gap: 8px; margin-left: 4px; }

        .cov-btn {
            padding: 4px 12px; border-radius: 6px; border: none;
            font-size: 0.76em; cursor: pointer; font-weight: 600;
            transition: opacity 0.15s;
        }
        .cov-btn:disabled { opacity: 0.35; cursor: default; }
        .cov-btn.start { background: #238636; color: #fff; }
        .cov-btn.stop  { background: #da3633; color: #fff; }

        #cov-info { font-size: 0.72em; color: #8b949e; white-space: nowrap; }

        /* ── Info bar ── */
        .info {
            margin-left: auto; font-size: 0.70em;
            color: #8b949e; white-space: nowrap;
        }

        /* ── Map area ── */
        main {
            flex: 1; display: flex;
            align-items: center; justify-content: center;
            overflow: hidden; padding: 10px; min-height: 0;
        }

        #map-canvas { display: block; image-rendering: pixelated; }
        #waiting    { color: #8b949e; font-size: 1em; }
    </style>
</head>
<body>

<header>
    <h1>TurtleBot3 即時地圖</h1>

    <div class="layers" id="layers"></div>

    <div class="cov-ctl">
        <button id="btn-start" class="cov-btn start" onclick="covStart()">▶ 開始覆蓋</button>
        <button id="btn-stop"  class="cov-btn stop"  onclick="covStop()" disabled>■ 停止</button>
        <span   id="cov-info">閒置</span>
    </div>

    <div class="info" id="info">等待資料...</div>
</header>

<main>
    <canvas id="map-canvas" style="display:none"></canvas>
    <div id="waiting">等待地圖資料...</div>
</main>

<script>
// ── 圖層定義 ──────────────────────────────────────────────────────────────────
const LAYERS = [
    { id: 'orig',    label: '原始地圖', color: '#c9d1d9', type: 'map',     url: '/map.png',         on: true  },
    { id: 'eroded',  label: '侵蝕層',   color: '#58a6ff', type: 'map',     url: '/map_eroded.png',  on: true  },
    { id: 'dilated', label: '膨脹層',   color: '#ff7b72', type: 'map',     url: '/map_dilated.png', on: true  },
    { id: 'covpath', label: '覆蓋路徑', color: '#c084fc', type: 'covpath', on: true  },
    { id: 'path',    label: '行走軌跡', color: '#e3b341', type: 'path',    on: true  },
    { id: 'robot',   label: '機器人',   color: '#3fb950', type: 'robot',   on: true  },
];

// ── 建立圖層按鈕 ──────────────────────────────────────────────────────────────
const layersEl = document.getElementById('layers');
LAYERS.forEach(layer => {
    const btn = document.createElement('button');
    btn.className = 'layer-btn' + (layer.on ? '' : ' off');
    btn.style.color = layer.color;
    btn.innerHTML   = `<span class="dot"></span>${layer.label}`;
    btn.addEventListener('click', () => {
        layer.on = !layer.on;
        btn.classList.toggle('off', !layer.on);
        draw();
    });
    layersEl.appendChild(btn);
});

// ── 狀態 ─────────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('map-canvas');
const ctx      = canvas.getContext('2d');
const mainEl   = document.querySelector('main');
const imgCache = {};
let robotState = { pos: null, path: [], resolution: 0.05 };
let covState   = { state: 'idle', done: 0, total: 0, msg: '', path_px: [] };

// ── Canvas 自適應視窗 ─────────────────────────────────────────────────────────
function fitCanvas() {
    const mw = canvas.width, mh = canvas.height;
    if (!mw || !mh) return;
    const scale = Math.min((mainEl.clientWidth - 20) / mw,
                           (mainEl.clientHeight - 20) / mh);
    canvas.style.width  = Math.round(mw * scale) + 'px';
    canvas.style.height = Math.round(mh * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);

// ── 工具 ──────────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function colorizeObstacles(img, hexColor) {
    const w = img.naturalWidth, h = img.naturalHeight;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    const id = cx.getImageData(0, 0, w, h), d = id.data;
    const [r, g, b] = hexToRgb(hexColor);
    for (let i = 0; i < d.length; i += 4) {
        const v = d[i];
        if      (v < 80)  { d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=220; }
        else if (v > 180) { d[i+3]=0; }
        else              { d[i]=55; d[i+1]=55; d[i+2]=75; d[i+3]=40; }
    }
    cx.putImageData(id, 0, 0);
    return c;
}

// ── 繪製函式 ──────────────────────────────────────────────────────────────────
function draw() {
    const origImg = imgCache['orig'];
    if (!origImg) return;

    const W = origImg.naturalWidth, H = origImg.naturalHeight;
    if (canvas.width !== W || canvas.height !== H) {
        canvas.width = W; canvas.height = H;
        fitCanvas();
    }

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, W, H);

    // 地圖圖層
    for (const layer of LAYERS) {
        if (layer.type !== 'map' || !layer.on) continue;
        const img = imgCache[layer.id];
        if (!img) continue;
        if (layer.id === 'orig') {
            ctx.globalAlpha = 1;
            ctx.drawImage(img, 0, 0, W, H);
        } else {
            ctx.globalAlpha = 0.85;
            ctx.drawImage(colorizeObstacles(img, layer.color), 0, 0, W, H);
            ctx.globalAlpha = 1;
        }
    }

    // 覆蓋路徑
    const covLayer = LAYERS.find(l => l.id === 'covpath');
    if (covLayer.on && covState.path_px.length > 1) {
        drawCovPath(covState.path_px, covLayer.color, covState.done);
    }

    // 行走軌跡
    const pathLayer = LAYERS.find(l => l.id === 'path');
    if (pathLayer.on && robotState.path.length > 1) {
        drawPath(robotState.path, pathLayer.color);
    }

    // 機器人位置
    const robotLayer = LAYERS.find(l => l.id === 'robot');
    if (robotLayer.on && robotState.pos) {
        drawRobot(robotState.pos.x, robotState.pos.y, robotLayer.color);
    }
}

function drawCovPath(pts, color, done) {
    if (pts.length < 2) return;
    ctx.save();

    // 已走（亮）
    if (done > 1) {
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.9;
        ctx.lineWidth   = 2;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < Math.min(done, pts.length); i++)
            ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.stroke();
    }

    // 未走（虛線）
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    ctx.moveTo(pts[Math.max(0, done - 1)][0], pts[Math.max(0, done - 1)][1]);
    for (let i = done; i < pts.length; i++)
        ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.restore();
}

function drawPath(path, color) {
    const FADE = 300, n = path.length, fade = Math.max(0, n - FADE);
    if (fade > 1) {
        ctx.beginPath(); ctx.strokeStyle = color;
        ctx.globalAlpha = 0.2; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
        ctx.moveTo(path[0][0], path[0][1]);
        for (let i = 1; i <= fade; i++) ctx.lineTo(path[i][0], path[i][1]);
        ctx.stroke();
    }
    for (let i = Math.max(fade, 1); i < n; i++) {
        ctx.beginPath(); ctx.strokeStyle = color;
        ctx.globalAlpha = 0.2 + 0.8 * ((i - fade) / Math.max(FADE, 1));
        ctx.lineWidth = 2;
        ctx.moveTo(path[i-1][0], path[i-1][1]);
        ctx.lineTo(path[i][0],   path[i][1]);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

function drawRobot(px, py, color) {
    const radius = Math.max(1, 0.105 / (robotState.resolution || 0.05));
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 6;
    ctx.fillStyle   = color;
    ctx.beginPath(); ctx.arc(px, py, radius, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
}

// ── 覆蓋控制 ─────────────────────────────────────────────────────────────────
async function covStart() {
    document.getElementById('btn-start').disabled = true;
    const res = await fetch('/coverage/start', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) alert('無法開始：' + data.msg);
}

async function covStop() {
    await fetch('/coverage/stop', { method: 'POST' });
}

function updateCovUI() {
    const s     = covState.state;
    const info  = document.getElementById('cov-info');
    const start = document.getElementById('btn-start');
    const stop  = document.getElementById('btn-stop');

    const labels = { idle: '閒置', running: `執行中 ${covState.done}/${covState.total}`,
                     stopped: '已停止', done: '完成 ✓', error: '錯誤：' + covState.msg };
    info.textContent   = labels[s] || s;
    start.disabled     = (s === 'running');
    stop.disabled      = (s !== 'running');
}

// ── 資料刷新 ──────────────────────────────────────────────────────────────────
function loadImg(url) {
    return new Promise((res, rej) => {
        const img = new Image();
        img.onload  = () => res(img);
        img.onerror = rej;
        img.src = url + '?t=' + Date.now();
    });
}

async function refresh() {
    const [, stateRes, covRes] = await Promise.allSettled([
        Promise.all(LAYERS.filter(l => l.type === 'map').map(async l => {
            try { imgCache[l.id] = await loadImg(l.url); } catch {}
        })),
        fetch('/robot_state').then(r => r.json()),
        fetch('/coverage/status').then(r => r.json()),
    ]);

    if (stateRes.status === 'fulfilled') robotState = stateRes.value;
    if (covRes.status   === 'fulfilled') covState   = covRes.value;

    if (imgCache['orig']) {
        canvas.style.display = '';
        document.getElementById('waiting').style.display = 'none';
    }

    updateCovUI();
    draw();

    const pos  = robotState.pos;
    const time = new Date().toLocaleTimeString('zh-TW');
    document.getElementById('info').textContent = pos
        ? `${time}  (${pos.wx}, ${pos.wy}) m  ${pos.yaw_deg}°`
        : `${time}  等待機器人`;
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
