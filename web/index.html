<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurtleBot3 地圖監控</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* ── 頂列 ── */
header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 7px 14px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    flex-shrink: 0;
}
h1 { font-size: 0.88em; font-weight: 600; color: #58a6ff; white-space: nowrap; }

/* 圖層按鈕 */
.layers { display: flex; gap: 5px; flex-wrap: wrap; }
.layer-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 9px;
    border-radius: 20px; border: 1.5px solid currentColor;
    background: transparent; color: inherit;
    font-size: 0.73em; cursor: pointer; user-select: none;
    transition: opacity 0.15s;
}
.layer-btn .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
}
.layer-btn.off { opacity: 0.35; }
.layer-btn.off .dot { background: transparent; border: 1.5px solid currentColor; }

/* 覆蓋控制 */
.cov {
    display: flex; align-items: center; gap: 7px;
    padding-left: 8px;
    border-left: 1px solid #30363d;
}
.btn {
    padding: 4px 12px; border-radius: 6px; border: none;
    font-size: 0.76em; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
}
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-start { background: #238636; color: #fff; }
.btn-stop  { background: #da3633; color: #fff; }
#cov-info  { font-size: 0.71em; color: #8b949e; white-space: nowrap; }

/* 右側資訊 */
.info { margin-left: auto; font-size: 0.70em; color: #8b949e; white-space: nowrap; }

/* ── 地圖區 ── */
main {
    flex: 1; display: flex;
    align-items: center; justify-content: center;
    overflow: hidden; padding: 10px; min-height: 0;
}
#canvas  { display: block; image-rendering: pixelated; }
#waiting { color: #8b949e; }
</style>
</head>
<body>

<header>
    <h1>TurtleBot3 即時地圖</h1>

    <div class="layers" id="layers"></div>

    <div class="cov">
        <button id="btn-start" class="btn btn-start" onclick="covStart()">▶ 開始覆蓋</button>
        <button id="btn-stop"  class="btn btn-stop"  onclick="covStop()" disabled>■ 停止</button>
        <span id="cov-info">閒置</span>
    </div>

    <div class="info" id="info">等待資料...</div>
</header>

<main>
    <canvas id="canvas" style="display:none"></canvas>
    <div id="waiting">等待地圖資料...</div>
</main>

<script>
// ════════════════════════════════════════════════════════
//  圖層定義
// ════════════════════════════════════════════════════════
const LAYERS = [
    { id: 'orig',    label: '原始地圖', color: '#c9d1d9', type: 'map',     url: '/map.png',         on: true  },
    { id: 'eroded',  label: '侵蝕層',   color: '#58a6ff', type: 'map',     url: '/map_eroded.png',  on: true  },
    { id: 'dilated', label: '膨脹層',   color: '#ff7b72', type: 'map',     url: '/map_dilated.png', on: true  },
    { id: 'covpath', label: '覆蓋路徑', color: '#c084fc', type: 'covpath', on: true  },
    { id: 'trail',   label: '行走軌跡', color: '#e3b341', type: 'trail',   on: true  },
    { id: 'robot',   label: '機器人',   color: '#3fb950', type: 'robot',   on: true  },
];

// ════════════════════════════════════════════════════════
//  初始化
// ════════════════════════════════════════════════════════
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const mainEl  = document.querySelector('main');
const imgCache = {};
let robot  = { pos: null, path: [], resolution: 0.05 };
let cov    = { state: 'idle', done: 0, total: 0, msg: '', path_px: [] };

// 建立圖層按鈕
document.getElementById('layers').append(
    ...LAYERS.map(layer => {
        const btn = document.createElement('button');
        btn.className = 'layer-btn' + (layer.on ? '' : ' off');
        btn.style.color = layer.color;
        btn.innerHTML = `<span class="dot"></span>${layer.label}`;
        btn.onclick = () => {
            layer.on = !layer.on;
            btn.classList.toggle('off', !layer.on);
            draw();
        };
        return btn;
    })
);

// Canvas 自動適應視窗
function fitCanvas() {
    if (!canvas.width) return;
    const s = Math.min(
        (mainEl.clientWidth  - 20) / canvas.width,
        (mainEl.clientHeight - 20) / canvas.height
    );
    canvas.style.width  = Math.round(canvas.width  * s) + 'px';
    canvas.style.height = Math.round(canvas.height * s) + 'px';
}
window.addEventListener('resize', fitCanvas);

// ════════════════════════════════════════════════════════
//  繪製
// ════════════════════════════════════════════════════════
function hexToRgb(hex) {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

// 把灰階地圖轉為彩色障礙物圖層（空地透明）
function colorize(img, hex) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    const id = cx.getImageData(0, 0, c.width, c.height), d = id.data;
    const [r,g,b] = hexToRgb(hex);
    for (let i = 0; i < d.length; i += 4) {
        const v = d[i];
        if      (v < 80)  { d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=220; }  // 障礙 → 著色
        else if (v > 180) { d[i+3]=0; }                                   // 空地 → 透明
        else              { d[i]=55; d[i+1]=55; d[i+2]=75; d[i+3]=40; }  // 未知 → 淡灰
    }
    cx.putImageData(id, 0, 0);
    return c;
}

function draw() {
    const orig = imgCache['orig'];
    if (!orig) return;

    const W = orig.naturalWidth, H = orig.naturalHeight;
    if (canvas.width !== W || canvas.height !== H) {
        canvas.width = W; canvas.height = H;
        fitCanvas();
    }

    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, W, H);

    // 地圖圖層
    for (const L of LAYERS) {
        if (L.type !== 'map' || !L.on || !imgCache[L.id]) continue;
        if (L.id === 'orig') {
            ctx.globalAlpha = 1;
            ctx.drawImage(imgCache[L.id], 0, 0, W, H);
        } else {
            ctx.globalAlpha = 0.85;
            ctx.drawImage(colorize(imgCache[L.id], L.color), 0, 0, W, H);
            ctx.globalAlpha = 1;
        }
    }

    // 覆蓋路徑
    const CL = LAYERS.find(l => l.id === 'covpath');
    if (CL.on && cov.path_px.length > 1) drawCovPath(cov.path_px, CL.color, cov.done);

    // 行走軌跡
    const TL = LAYERS.find(l => l.id === 'trail');
    if (TL.on && robot.path.length > 1) drawTrail(robot.path, TL.color);

    // 機器人位置
    const RL = LAYERS.find(l => l.id === 'robot');
    if (RL.on && robot.pos) drawRobot(robot.pos.x, robot.pos.y, RL.color);
}

function drawCovPath(pts, color, done) {
    ctx.save();
    // 已走部分：實線
    if (done > 1) {
        ctx.strokeStyle = color; ctx.globalAlpha = 0.9;
        ctx.lineWidth = 2; ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < Math.min(done, pts.length); i++)
            ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.stroke();
    }
    // 待走部分：虛線
    const from = Math.max(0, done - 1);
    ctx.strokeStyle = color; ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
    ctx.beginPath();
    ctx.moveTo(pts[from][0], pts[from][1]);
    for (let i = from + 1; i < pts.length; i++)
        ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
}

function drawTrail(path, color) {
    const FADE = 300, n = path.length, f = Math.max(0, n - FADE);
    // 舊軌跡：整段淡色
    if (f > 1) {
        ctx.beginPath(); ctx.strokeStyle = color;
        ctx.globalAlpha = 0.2; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
        ctx.moveTo(path[0][0], path[0][1]);
        for (let i = 1; i <= f; i++) ctx.lineTo(path[i][0], path[i][1]);
        ctx.stroke();
    }
    // 近期：逐段漸亮
    for (let i = Math.max(f, 1); i < n; i++) {
        ctx.beginPath(); ctx.strokeStyle = color;
        ctx.globalAlpha = 0.2 + 0.8 * ((i - f) / Math.max(FADE, 1));
        ctx.lineWidth = 2;
        ctx.moveTo(path[i-1][0], path[i-1][1]);
        ctx.lineTo(path[i][0],   path[i][1]);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

function drawRobot(px, py, color) {
    const r = Math.max(1, 0.105 / (robot.resolution || 0.05));
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 6;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(px, py, r, 0, 2*Math.PI); ctx.fill();
    ctx.restore();
}

// ════════════════════════════════════════════════════════
//  覆蓋控制
// ════════════════════════════════════════════════════════
async function covStart() {
    document.getElementById('btn-start').disabled = true;
    const res  = await fetch('/coverage/start', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) {
        alert('無法開始：' + data.msg);
        document.getElementById('btn-start').disabled = false;
    }
}

async function covStop() {
    await fetch('/coverage/stop', { method: 'POST' });
}

function updateCovUI() {
    const labels = {
        idle:    '閒置',
        running: `執行中 ${cov.done} / ${cov.total}`,
        stopped: '已停止',
        done:    '完成 ✓',
        error:   '錯誤：' + cov.msg,
    };
    document.getElementById('cov-info').textContent = labels[cov.state] ?? cov.state;
    document.getElementById('btn-start').disabled = (cov.state === 'running');
    document.getElementById('btn-stop').disabled  = (cov.state !== 'running');
}

// ════════════════════════════════════════════════════════
//  資料輪詢（每秒）
// ════════════════════════════════════════════════════════
function loadImg(url) {
    return new Promise((ok, fail) => {
        const img = new Image();
        img.onload = () => ok(img); img.onerror = fail;
        img.src = url + '?t=' + Date.now();
    });
}

async function refresh() {
    // 平行載入地圖圖片 + 機器人狀態 + 覆蓋狀態
    const [, robotRes, covRes] = await Promise.allSettled([
        Promise.all(LAYERS.filter(l => l.type === 'map').map(async L => {
            try { imgCache[L.id] = await loadImg(L.url); } catch {}
        })),
        fetch('/robot_state').then(r => r.json()),
        fetch('/coverage/status').then(r => r.json()),
    ]);

    if (robotRes.status === 'fulfilled') robot = robotRes.value;
    if (covRes.status   === 'fulfilled') cov   = covRes.value;

    // 首次拿到地圖後顯示 canvas
    if (imgCache['orig']) {
        canvas.style.display = '';
        document.getElementById('waiting').style.display = 'none';
    }

    updateCovUI();
    draw();

    const p    = robot.pos;
    const time = new Date().toLocaleTimeString('zh-TW');
    document.getElementById('info').textContent = p
        ? `${time}  (${p.wx}, ${p.wy}) m`
        : `${time}  等待機器人`;
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
